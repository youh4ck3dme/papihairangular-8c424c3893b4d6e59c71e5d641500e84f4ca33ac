<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - PAPI HAIR DESIGN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 2rem;
            animation: logoBreathing 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
        }

        @keyframes logoBreathing {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(0.95);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #d4af37, #f4c542, #d4af37);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        p {
            font-size: 1.125rem;
            color: #cccccc;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .retry-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #d4af37, #f4c542);
            color: #000000;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .info-box {
            margin-top: 3rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .info-box h3 {
            color: #d4af37;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .info-box ul {
            list-style: none;
            text-align: left;
            color: #aaaaaa;
        }

        .info-box li {
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
        }

        .info-box li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #d4af37;
            font-weight: bold;
        }

        .connection-status {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 20px;
            color: #ef4444;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .connection-status.online {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.5);
            color: #22c55e;
        }
    </style>
</head>

<body>
    <div class="offline-container">
        <img src="/images/logo.png" alt="PAPI HAIR DESIGN" class="logo" onerror="this.style.display='none'">

        <div class="icon">📡</div>

        <div id="status" class="connection-status">Offline</div>

        <h1>Ste Offline</h1>

        <p>
            Vyzerá to, že nemáte pripojenie k internetu.<br>
            Skontrolujte svoje pripojenie a skúste to znova.
        </p>

        <button class="retry-btn" onclick="location.reload()">
            🔄 Skúsiť znova
        </button>

        <div class="info-box">
            <h3>Čo môžete urobiť:</h3>
            <ul>
                <li>Skontrolujte Wi-Fi alebo mobilné dáta</li>
                <li>Vypnite režim lietadla, ak je zapnutý</li>
                <li>Reštartujte router alebo modem</li>
                <li>Skúste obnoviť stránku o chvíľu</li>
            </ul>
        </div>
    </div>

    <script>
        // Monitor connection status
        function updateConnectionStatus() {
            const statusEl = document.getElementById('status');
            if (navigator.onLine) {
                statusEl.textContent = 'Online';
                statusEl.classList.add('online');
                // Auto-reload when back online
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                statusEl.textContent = 'Offline';
                statusEl.classList.remove('online');
            }
        }

        // Listen for connection changes
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // Initial check
        updateConnectionStatus();

        // Periodic check
        setInterval(updateConnectionStatus, 5000);
    </script>
</body>

</html>
