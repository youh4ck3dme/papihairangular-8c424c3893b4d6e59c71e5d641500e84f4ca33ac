<section class="story-hero">
  <figure class="hero-wrapper">
    <img [ngSrc]="assetPath + 'founder-robert-papcun-hero.webp'" width="1200" height="800"
      alt="Portrét zakladateľa Róberta Papcuna - Papi Hair Design" priority class="hero-img">
  </figure>
</section>

<section class="story-grid-container">

  <figure class="grid-item location">
    <img [ngSrc]="assetPath + 'location-spolocensky-pavilon.webp'" width="800" height="600"
      alt="Vstup do salónu Papi Hair Design v Spoločenskom pavilóne Košice" class="responsive-img">
    <figcaption>Prestížna lokalita v Spoločenskom pavilóne</figcaption>
  </figure>

  <figure class="grid-item interior">
    <img [ngSrc]="assetPath + 'interior-panorama.webp'" width="1920" height="1080"
      sizes="(max-width: 768px) 100vw, 80vw" alt="Panoramatický pohľad na interiér salónu Papi Hair Design"
      class="responsive-img">
  </figure>

  <figure class="grid-item team">
    <img [ngSrc]="assetPath + 'team-group-photo.webp'" width="800" height="600" alt="Tím profesionálov Papi Hair Design"
      class="responsive-img">
    <figcaption>Náš tím expertov</figcaption>
  </figure>

  <figure class="grid-item products">
    <img [ngSrc]="assetPath + 'products-gold-haircare.webp'" width="600" height="600"
      alt="Detail produktov GOLD Haircare používaných v salóne" class="responsive-img">
    <figcaption>Sme hrdí ambasádori GOLD Haircare</figcaption>
  </figure>

  <figure class="grid-item history">
    <img [ngSrc]="assetPath + 'history-opening-2022.webp'" width="800" height="600"
      alt="Fotografia z otvorenia salónu v roku 2022" class="responsive-img vintage-filter">
    <figcaption>Začiatok našej cesty (Jún 2022)</figcaption>
  </figure>

</section>
