# Kontrola každého PR: audit závislostí, produkčný build (CSP, bez source máp) a testy webu
# vrátane bezpečnostných hlavičiek a CSP. Žiadny deploy – ten robí len majiteľ (AGENTS.md).
name: security
on:
  pull_request:
  push:
    branches-ignore: [main]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # runtime závislosti: kritické zraniteľnosti zastavia PR
      - run: pnpm audit --prod --audit-level critical
      - run: node scripts/ensure-env.mjs && pnpm run build:prod
      - run: npx playwright install --with-deps chromium
      - run: pnpm run test:site
      - run: npx eslint src e2e --quiet
