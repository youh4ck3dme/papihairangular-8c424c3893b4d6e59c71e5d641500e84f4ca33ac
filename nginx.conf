# PAPI HAIR DESIGN – nginx pre Docker/VPS (ekvivalent vercel.json).
# Web je predgenerovaný (Angular prerendering): /cennik → /cennik/index.html,
# neznáma URL → 404.html so statusom 404 (Angular zobrazí NotFound s noindex).
# Certifikáty: docker-compose.yml mountuje ./ssl → /etc/ssl/certs a /etc/ssl/private.

# Cache-Control podľa cesty (jedno miesto – add_header v location by zrušil bezpečnostné hlavičky zo server bloku)
map $uri $papi_cache {
    default                                              "no-cache";
    /ngsw.json                                           "no-cache, no-store, must-revalidate";
    ~*^/(main|chunk|polyfills|styles)-[A-Z0-9]+\.(js|css)$ "public, max-age=31536000, immutable";
    ~^/media/                                            "public, max-age=31536000, immutable";
    # písma sa nemenia – pri zmene písma premenovať súbor (verzia v názve)
    ~^/assets/fonts/                                     "public, max-age=31536000, immutable";
    # obrázky 30 dní (nemajú hash v názve)
    ~^/(assets|images)/                                  "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # nahraďte skutočným certifikátom (napr. Let's Encrypt) – názvy podľa ./ssl
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # predkomprimované súbory z `npm run build:vps` (scripts/precompress.mjs) – bez CPU pri každej požiadavke
    gzip_static on;
    # brotli_static on;   # odkomentovať, ak nginx má modul ngx_brotli (oficiálny nginx:alpine ho nemá)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # --- bezpečnostné hlavičky (rovnaké ako vercel.json, kontroluje e2e/security.spec.ts) ---
    # CSP pre skripty je v <meta> každej stránky (hashe inline skriptov, scripts/csp.mjs); tu sú
    # direktívy, ktoré v <meta> nefungujú. COEP sa nepoužíva – rozbil by mapu Google v iframe.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Cache-Control $papi_cache always;
    server_tokens off;

    # --- presmerovania (rovnaké ako vercel.json) ---
    location = /booking { return 302 https://services.bookio.com/papi-hair-design/widget?lang=sk; }
    location = /shop    { return 302 https://www.goldhaircare.sk/affiliate/2208; }
    # odstránené AI stránky a admin → domov (301, aby Google preniesol hodnotu)
    location ~ ^/(ai-studio|ai-stylista|virtualny-stylista|virtual-salon|diagnostika|admin)(/.*)?$ { return 301 /; }
    # kanonické URL bez lomky na konci
    rewrite ^/(.+)/$ /$1 permanent;

    # --- cache: hodnotu určuje map $papi_cache hore (add_header v location by zrušil bezpečnostné hlavičky) ---
    location = /ngsw-worker.js { try_files $uri =404; }
    location = /ngsw.json      { try_files $uri =404; }

    # --- stránky ---
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
