# PAPI HAIR DESIGN – nginx pre Docker/VPS (ekvivalent vercel.json).
# Web je predgenerovaný (Angular prerendering): /cennik → /cennik/index.html,
# neznáma URL → 404.html so statusom 404 (Angular zobrazí NotFound s noindex).
# Certifikáty: docker-compose.yml mountuje ./ssl → /etc/ssl/certs a /etc/ssl/private.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # nahraďte skutočným certifikátom (napr. Let's Encrypt) – názvy podľa ./ssl
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # --- presmerovania (rovnaké ako vercel.json) ---
    location = /booking { return 302 https://services.bookio.com/papi-hair-design/widget?lang=sk; }
    location = /shop    { return 302 https://www.goldhaircare.sk/affiliate/2208; }
    # odstránené AI stránky a admin → domov (301, aby Google preniesol hodnotu)
    location ~ ^/(ai-studio|ai-stylista|virtualny-stylista|virtual-salon|diagnostika|admin)(/.*)?$ { return 301 /; }
    # kanonické URL bez lomky na konci
    rewrite ^/(.+)/$ /$1 permanent;

    # --- cache ---
    # service worker a jeho manifest nikdy necachovať (inak sa web neaktualizuje)
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /ngsw.json      { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    # súbory s hashom v názve sa nemenia
    location ~* ^/(main|chunk|polyfills|styles)-[A-Z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /media/  { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location /images/ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

    # --- stránky ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache"; }
}
